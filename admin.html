<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gravitas'26 Admin Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet">

    <style>
        /* ===== CSS Variables / Themes ===== */
        :root {
            --bg-body: #f0f2f8;
            --bg-card: rgba(255, 255, 255, 0.75);
            --backdrop-blur: 20px;
            --border-card: rgba(255, 255, 255, 0.3);
            --bg-input: rgba(255, 255, 255, 0.8);
            --text-primary: #1a1a2e;
            --text-secondary: #3d3d5c;
            --text-muted: #7a7a9e;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.10);
            --shadow-hover: 0 30px 80px rgba(0, 0, 0, 0.15);
            --radius: 24px;
            --radius-sm: 12px;
            --accent-start: #4f46e5;
            --accent-end: #7c3aed;
            --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            --accent-light: rgba(79, 70, 229, 0.12);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --modal-bg: rgba(255, 255, 255, 0.92);
            --modal-border: rgba(255, 255, 255, 0.3);
            --modal-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            --modal-overlay: rgba(0, 0, 0, 0.35);
            --modal-text: #1a1a2e;
            --table-stripe: #f8f9fc;
            --table-hover: #f0f4ff;
        }

        [data-theme="dark"] {
            --bg-body: #0c0c18;
            --bg-card: rgba(26, 26, 46, 0.92);
            --border-card: rgba(255, 255, 255, 0.10);
            --bg-input: rgba(45, 45, 70, 0.95);
            --text-primary: #f0f0ff;
            --text-secondary: #d0d0ec;
            --text-muted: #b0b0d0;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.8);
            --shadow-hover: 0 30px 80px rgba(0, 0, 0, 0.9);
            --accent-light: rgba(129, 140, 248, 0.20);
            --modal-bg: rgba(26, 26, 46, 0.95);
            --modal-border: rgba(255, 255, 255, 0.10);
            --modal-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
            --modal-overlay: rgba(0, 0, 0, 0.6);
            --modal-text: #f0f0ff;
            --table-stripe: #1e1e36;
            --table-hover: #2a2a50;
        }

        /* ===== Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            padding: 1.5rem;
            perspective: 1200px;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 3D Background Canvas ===== */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.8s ease;
        }

        [data-theme="dark"] #three-canvas {
            opacity: 0.3;
        }

        /* ===== Navbar ===== */
        .navbar {
            position: relative;
            z-index: 10;
            background: var(--bg-card);
            backdrop-filter: var(--backdrop-blur);
            -webkit-backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 0.75rem 1.5rem;
            margin-bottom: 2rem;
            transition: background var(--transition), box-shadow var(--transition);
        }

        .navbar .navbar-brand {
            font-weight: 700;
            color: var(--text-primary);
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.25rem;
        }

        .navbar .navbar-brand i {
            -webkit-text-fill-color: var(--accent-start);
            margin-right: 0.5rem;
        }

        .navbar .text-white {
            color: var(--text-secondary) !important;
        }

        .navbar .btn-light {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 50px;
            transition: all var(--transition);
        }

        .navbar .btn-light:hover {
            background: var(--accent-light);
            border-color: var(--accent-start);
            color: var(--accent-start);
        }

        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 0.3rem 0.7rem 0.3rem 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            font-family: var(--font);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .theme-toggle:hover {
            border-color: var(--accent-start);
            background: var(--accent-light);
            transform: scale(1.02);
        }

        .theme-toggle .toggle-track {
            width: 32px;
            height: 18px;
            border-radius: 50px;
            background: var(--border-color);
            position: relative;
            transition: background var(--transition);
            flex-shrink: 0;
        }

        .theme-toggle .toggle-track .toggle-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform var(--transition), background var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] .theme-toggle .toggle-track {
            background: var(--accent-start);
        }

        [data-theme="dark"] .theme-toggle .toggle-track .toggle-thumb {
            transform: translateX(14px);
            background: #fff;
        }

        .theme-toggle .toggle-label {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        /* ===== Cards ===== */
        .card {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            backdrop-filter: var(--backdrop-blur);
            -webkit-backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: all var(--transition);
            color: var(--text-primary);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card h6 {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .card h2 {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* ===== Table ===== */
        .table-wrap {
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            backdrop-filter: blur(4px);
        }

        .table {
            margin-bottom: 0;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .table th,
        .table td {
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .table thead th {
            background: var(--table-stripe);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1.5px solid var(--border-color);
            padding: 0.9rem 1rem;
        }

        .table tbody td {
            padding: 0.7rem 1rem;
            vertical-align: middle;
            background: transparent;
            border-bottom: 1px solid var(--border-color);
        }

        .table tbody tr:hover td {
            background: var(--table-hover);
        }

        .table tbody tr:last-child td {
            border-bottom: 0;
        }

        /* ===== Form Controls ===== */
        .form-control,
        .form-select {
            background: var(--bg-input);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.9rem;
            padding: 0.6rem 1rem;
            transition: all var(--transition);
            font-family: var(--font);
            backdrop-filter: blur(4px);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--accent-start);
            box-shadow: 0 0 0 4px var(--accent-light);
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        /* ===== Buttons ===== */
        .btn-outline-primary {
            border-color: var(--border-color);
            color: var(--text-secondary);
            border-radius: 50px;
            transition: all var(--transition);
        }

        .btn-outline-primary:hover {
            background: var(--accent-light);
            border-color: var(--accent-start);
            color: var(--accent-start);
        }

        .btn-success {
            background: var(--accent-gradient);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-weight: 600;
            transition: all var(--transition);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.45);
            color: #fff;
        }

        /* ===== Modal ===== */
        .modal-content {
            background: var(--modal-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--modal-border);
            border-radius: var(--radius);
            box-shadow: var(--modal-shadow);
            color: var(--modal-text);
        }

        .modal-header,
        .modal-footer {
            border-color: var(--border-color);
        }

        .modal-header .btn-close {
            filter: var(--btn-close-filter);
        }

        /* ===== Responsive ===== */
        @media (max-width: 992px) {
            .navbar {
                flex-wrap: wrap;
            }

            .navbar .d-flex {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 0.75rem;
            }

            .navbar {
                border-radius: 16px;
                padding: 0.75rem 1rem;
            }

            .navbar .navbar-brand {
                font-size: 1rem;
            }

            .container {
                padding-left: 0 !important;
                padding-right: 0 !important;
            }

            .card {
                margin-bottom: 0.75rem;
            }

            .table-wrap {
                overflow-x: auto;
            }

            .table {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 576px) {
            .navbar .d-flex {
                width: 100%;
                justify-content: space-between;
            }

            #search {
                max-width: 100% !important;
            }

            .col-md-5.text-end {
                text-align: left !important;
                margin-top: 0.5rem;
            }

            .btn {
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-start);
            border-radius: 10px;
        }

        /* ===== Utility overrides ===== */
        .text-white {
            color: var(--text-secondary) !important;
        }

        .table-dark {
            background: var(--table-stripe);
            color: var(--text-secondary);
        }

        .table-bordered {
            border-color: var(--border-color);
        }

        .table-hover>tbody>tr:hover>* {
            background-color: var(--table-hover);
        }
    </style>
</head>

<body>

    <!-- 3D Background Canvas -->
    <div id="three-canvas"></div>

    <nav class="navbar">
        <div class="container-fluid px-0">
            <span class="navbar-brand">
                <i class="bi bi-speedometer2"></i>
                Gravitas'26 Admin Dashboard
            </span>

            <div class="d-flex align-items-center gap-2">
                <span id="adminEmail" class="text-white me-2"></span>

                <button class="theme-toggle" id="themeToggle" type="button">
                    <span class="toggle-track">
                        <span class="toggle-thumb"></span>
                    </span>
                    <span class="toggle-label">
                        <i class="bi bi-sun-fill" id="themeIcon"></i>
                        <span id="themeLabel">Light</span>
                    </span>
                </button>

                <button id="logoutBtn" class="btn btn-light btn-sm">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row g-3">
            <div class="col-md-4 col-6">
                <div class="card p-3">
                    <h6>Total Requests</h6>
                    <h2 id="totalRequests">0</h2>
                </div>
            </div>
            <div class="col-md-4 col-6">
                <div class="card p-3">
                    <h6>Domain Requests</h6>
                    <h2 id="domainCount">0</h2>
                </div>
            </div>
            <div class="col-md-4 col-12">
                <div class="card p-3">
                    <h6>Today's Requests</h6>
                    <h2 id="todayCount">0</h2>
                </div>
            </div>
        </div>

        <div class="card mt-4 p-3">
            <div class="row mb-3 align-items-center">
                <div class="col-md-7 mb-2 mb-md-0">
                    <input type="text" id="search" class="form-control" placeholder="Search...">
                </div>
                <div class="col-md-5 text-md-end">
                    <button class="btn btn-outline-primary me-2" id="refreshBtn">
                        <i class="bi bi-arrow-clockwise"></i>
                        Refresh
                    </button>
                    <button class="btn btn-success" id="excelBtn">
                        <i class="bi bi-file-earmark-excel"></i>
                        Export Excel
                    </button>
                </div>
            </div>

            <div class="table-wrap">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Department</th>
                            <th>Coordinator</th>
                            <th>Mobile</th>
                            <th>Items</th>
                            <th style="min-width: 145px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div class="modal fade" id="viewModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Purchase Details</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="modalContent"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                    <button class="btn btn-danger" id="downloadPdfBtn">
                        <i class="bi bi-file-earmark-pdf"></i>
                        Save as PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- Theme & 3D Toggle -->
    <script>
        // =============================================================
        // 1. Three.js Background
        // =============================================================
        (function initThree() {
            const container = document.getElementById('three-canvas');
            if (!container) return;

            const getTheme = () => {
                const stored = localStorage.getItem('gravitas-theme');
                if (stored) return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };
            let theme = getTheme();

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 1, 2);
            scene.add(dirLight);
            const backLight = new THREE.DirectionalLight(0x4f46e5, 0.5);
            backLight.position.set(-1, -1, -2);
            scene.add(backLight);

            const geometry = new THREE.IcosahedronGeometry(1.8, 0);
            const material = new THREE.MeshPhysicalMaterial({
                color: theme === 'dark' ? 0x818cf8 : 0x4f46e5,
                wireframe: true,
                transparent: true,
                opacity: 0.25,
                roughness: 0.2,
                metalness: 0.1,
                emissive: theme === 'dark' ? 0x1a1a3e : 0xeef2ff,
                emissiveIntensity: 0.1,
            });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const knotGeo = new THREE.TorusKnotGeometry(0.8, 0.25, 64, 8);
            const knotMat = new THREE.MeshPhysicalMaterial({
                color: theme === 'dark' ? 0x7c3aed : 0x7c3aed,
                transparent: true,
                opacity: 0.15,
                roughness: 0.3,
                metalness: 0.2,
            });
            const knot = new THREE.Mesh(knotGeo, knotMat);
            knot.position.set(1.5, -1, -1);
            scene.add(knot);

            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 300;
            const posArray = new Float32Array(particlesCount * 3);
            for (let i = 0; i < particlesCount * 3; i += 3) {
                posArray[i] = (Math.random() - 0.5) * 20;
                posArray[i + 1] = (Math.random() - 0.5) * 20;
                posArray[i + 2] = (Math.random() - 0.5) * 20 - 4;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({
                color: theme === 'dark' ? 0x818cf8 : 0x4f46e5,
                size: 0.04,
                transparent: true,
                opacity: 0.6,
            });
            const particles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particles);

            let mouseX = 0, mouseY = 0;
            const handleMouseMove = (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            };
            window.addEventListener('mousemove', handleMouseMove);

            let time = 0;
            const animate = () => {
                requestAnimationFrame(animate);
                time += 0.002;
                mesh.rotation.x = time * 0.2 + mouseY * 0.1;
                mesh.rotation.y = time * 0.3 + mouseX * 0.1;
                knot.rotation.x = time * 0.4;
                knot.rotation.y = time * 0.5;
                particles.rotation.y = time * 0.02;
                renderer.render(scene, camera);
            };
            animate();

            const handleResize = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };
            window.addEventListener('resize', handleResize);

            const updateColors = (newTheme) => {
                theme = newTheme;
                const mainColor = theme === 'dark' ? 0x818cf8 : 0x4f46e5;
                const emissive = theme === 'dark' ? 0x1a1a3e : 0xeef2ff;
                material.color.setHex(mainColor);
                material.emissive.setHex(emissive);
                particlesMat.color.setHex(mainColor);
            };

            window.__threeUpdateColors = updateColors;
        })();

        // =============================================================
        // 2. Theme Toggle
        // =============================================================
        (function themeToggle() {
            const toggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');

            const getTheme = () => {
                const stored = localStorage.getItem('gravitas-theme');
                if (stored) return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };

            let currentTheme = getTheme();

            const applyTheme = (theme) => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('gravitas-theme', theme);
                currentTheme = theme;

                if (theme === 'light') {
                    themeIcon.className = 'bi bi-sun-fill';
                    themeLabel.textContent = 'Light';
                } else {
                    themeIcon.className = 'bi bi-moon-fill';
                    themeLabel.textContent = 'Dark';
                }

                if (window.__threeUpdateColors) {
                    window.__threeUpdateColors(theme);
                }
            };

            applyTheme(currentTheme);

            toggleBtn.addEventListener('click', () => {
                const next = currentTheme === 'light' ? 'dark' : 'light';
                applyTheme(next);
            });
        })();
    </script>

    <script type="module" src="admin.js?v=2"></script>
</body>

</html>
