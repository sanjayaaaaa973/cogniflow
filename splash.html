<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniFlow</title>

    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* ===== CSS Variables / Themes ===== */
        :root {
            --bg-body: #f0f2f8;
            --bg-card: rgba(255, 255, 255, 0.75);
            --backdrop-blur: 20px;
            --border-card: rgba(255, 255, 255, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: #3d3d5c;
            --text-muted: #7a7a9e;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.10);
            --shadow-hover: 0 30px 80px rgba(0, 0, 0, 0.15);
            --radius: 28px;
            --radius-sm: 12px;
            --accent-start: #4f46e5;
            --accent-end: #7c3aed;
            --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            --accent-light: rgba(79, 70, 229, 0.12);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --loader-bg: rgba(0, 0, 0, 0.08);
            --logo-shadow: rgba(79, 70, 229, 0.55);
            --tagline-color: #7a7a9e;
            --subtitle-color: #3d3d5c;
        }

        [data-theme="dark"] {
            --bg-body: #0c0c18;
            --bg-card: rgba(26, 26, 46, 0.92);
            --border-card: rgba(255, 255, 255, 0.10);
            --text-primary: #f0f0ff;
            --text-secondary: #d0d0ec;
            --text-muted: #b0b0d0;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.8);
            --shadow-hover: 0 30px 80px rgba(0, 0, 0, 0.9);
            --accent-light: rgba(129, 140, 248, 0.20);
            --loader-bg: rgba(255, 255, 255, 0.08);
            --logo-shadow: rgba(129, 140, 248, 0.55);
            --tagline-color: #b0b0d0;
            --subtitle-color: #d0d0ec;
        }

        /* ===== Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            perspective: 1200px;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== 3D Background Canvas ===== */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.8s ease;
        }

        [data-theme="dark"] #three-canvas {
            opacity: 0.3;
        }

        /* ===== Splash Card ===== */
        .splash {
            position: relative;
            z-index: 1;
            width: min(500px, 92%);
            padding: 55px 40px 45px;
            text-align: center;
            background: var(--bg-card);
            backdrop-filter: var(--backdrop-blur);
            -webkit-backdrop-filter: var(--backdrop-blur);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: all var(--transition);
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            will-change: transform;
            animation: appear 0.9s ease;
        }

        .splash:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ===== Theme Toggle (top-right) ===== */
        .theme-toggle-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.25rem;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 0.3rem 0.7rem 0.3rem 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            font-family: var(--font);
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .theme-toggle:hover {
            border-color: var(--accent-start);
            background: var(--accent-light);
            transform: scale(1.02);
        }

        .theme-toggle .toggle-track {
            width: 32px;
            height: 18px;
            border-radius: 50px;
            background: var(--border-color);
            position: relative;
            transition: background var(--transition);
            flex-shrink: 0;
        }

        .theme-toggle .toggle-track .toggle-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform var(--transition), background var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] .theme-toggle .toggle-track {
            background: var(--accent-start);
        }

        [data-theme="dark"] .theme-toggle .toggle-track .toggle-thumb {
            transform: translateX(14px);
            background: #fff;
        }

        .theme-toggle .toggle-label {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        /* ===== Logo ===== */
        .splash-logo-container {
            margin: 0 auto 1.5rem;
            max-width: 360px;
        }

        .splash-logo {
            width: 100%;
            height: auto;
            object-fit: contain;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 25px rgba(79, 70, 229, 0.7));
            animation: float 2.5s ease-in-out infinite;
        }

        /* ===== Typography ===== */
        h1 {
            margin-top: 20px;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            margin-top: 8px;
            color: var(--tagline-color);
            font-size: 16px;
            font-weight: 500;
        }

        .subtitle {
            margin-top: 20px;
            color: var(--subtitle-color);
            font-size: 14px;
            font-weight: 400;
        }

        /* ===== Loader ===== */
        .loader {
            width: 100%;
            height: 6px;
            margin-top: 30px;
            border-radius: 20px;
            overflow: hidden;
            background: var(--loader-bg);
            border: 1px solid var(--border-color);
        }

        .progress {
            width: 0;
            height: 100%;
            border-radius: 20px;
            background: var(--accent-gradient);
            animation: load 2.8s ease forwards;
            box-shadow: 0 0 20px var(--accent-start);
        }

        .loading {
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .dots span {
            animation: blink 1.4s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 35px;
            padding-top: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            letter-spacing: 0.3px;
        }

        /* ===== Animations ===== */
        @keyframes load {
            0% {
                width: 0;
            }

            35% {
                width: 35%;
            }

            70% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 576px) {
            .splash {
                padding: 35px 22px 30px;
                border-radius: 22px;
            }

            h1 {
                font-size: 34px;
            }

            .logo-wrapper {
                max-width: 300px;
                padding: 12px 20px;
            }

            .tagline {
                font-size: 14px;
            }

            .subtitle {
                font-size: 13px;
            }

            .theme-toggle {
                font-size: 0.7rem;
                padding: 0.2rem 0.5rem 0.2rem 0.4rem;
            }

            .theme-toggle .toggle-track {
                width: 28px;
                height: 16px;
            }

            .theme-toggle .toggle-track .toggle-thumb {
                width: 12px;
                height: 12px;
            }

            [data-theme="dark"] .theme-toggle .toggle-track .toggle-thumb {
                transform: translateX(12px);
            }
        }

        @media (max-width: 400px) {
            .splash {
                padding: 28px 16px 24px;
            }

            h1 {
                font-size: 28px;
            }

            .logo-wrapper {
                max-width: 250px;
                padding: 10px 16px;
            }
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-start);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- 3D Background Canvas -->
    <div id="three-canvas"></div>

    <!-- Splash Card -->
    <div class="splash" id="splashCard">

        <!-- Theme Toggle -->
        <div class="theme-toggle-wrapper">
            <button class="theme-toggle" id="themeToggle" type="button">
                <span class="toggle-track">
                    <span class="toggle-thumb"></span>
                </span>
                <span class="toggle-label">
                    <i class="bi bi-sun-fill" id="themeIcon"></i>
                    <span id="themeLabel">Light</span>
                </span>
            </button>
        </div>

        <!-- Logo -->
        <!-- Logo -->
        <div class="splash-logo-container">
            <img src="images/logo.png" alt="CogniFlow Logo" class="splash-logo">
        </div>

        <!-- Brand -->
        <div class="tagline">AI-Powered Cognitive Learning</div>
        <div class="subtitle">Personalizing your learning journey</div>

        <!-- Loader -->
        <div class="loader">
            <div class="progress"></div>
        </div>

        <div class="loading">
            Preparing your personalized experience
            <span class="dots">
                <span>.</span><span>.</span><span>.</span>
            </span>
        </div>

        <!-- Footer -->
        <div class="footer">
            Adaptive Cognitive Flow Orchestration
        </div>
    </div>

    <!-- ===== Three.js ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- ===== Theme & 3D ===== -->
    <script>
        // =============================================================
        // 1. Three.js Background
        // =============================================================
        (function initThree() {
            const container = document.getElementById('three-canvas');
            if (!container) return;

            const getTheme = () => {
                const stored = localStorage.getItem('gravitas-theme');
                if (stored) return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };
            let theme = getTheme();

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 1, 2);
            scene.add(dirLight);
            const backLight = new THREE.DirectionalLight(0x4f46e5, 0.5);
            backLight.position.set(-1, -1, -2);
            scene.add(backLight);

            // Main shape
            const geometry = new THREE.IcosahedronGeometry(1.8, 0);
            const material = new THREE.MeshPhysicalMaterial({
                color: theme === 'dark' ? 0x818cf8 : 0x4f46e5,
                wireframe: true,
                transparent: true,
                opacity: 0.25,
                roughness: 0.2,
                metalness: 0.1,
                emissive: theme === 'dark' ? 0x1a1a3e : 0xeef2ff,
                emissiveIntensity: 0.1,
            });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Torus knot
            const knotGeo = new THREE.TorusKnotGeometry(0.8, 0.25, 64, 8);
            const knotMat = new THREE.MeshPhysicalMaterial({
                color: theme === 'dark' ? 0x7c3aed : 0x7c3aed,
                transparent: true,
                opacity: 0.15,
                roughness: 0.3,
                metalness: 0.2,
            });
            const knot = new THREE.Mesh(knotGeo, knotMat);
            knot.position.set(1.5, -1, -1);
            scene.add(knot);

            // Particles
            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 300;
            const posArray = new Float32Array(particlesCount * 3);
            for (let i = 0; i < particlesCount * 3; i += 3) {
                posArray[i] = (Math.random() - 0.5) * 20;
                posArray[i + 1] = (Math.random() - 0.5) * 20;
                posArray[i + 2] = (Math.random() - 0.5) * 20 - 4;
            }
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({
                color: theme === 'dark' ? 0x818cf8 : 0x4f46e5,
                size: 0.04,
                transparent: true,
                opacity: 0.6,
            });
            const particles = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particles);

            let mouseX = 0, mouseY = 0;
            const handleMouseMove = (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            };
            window.addEventListener('mousemove', handleMouseMove);

            let time = 0;
            const animate = () => {
                requestAnimationFrame(animate);
                time += 0.002;
                mesh.rotation.x = time * 0.2 + mouseY * 0.1;
                mesh.rotation.y = time * 0.3 + mouseX * 0.1;
                knot.rotation.x = time * 0.4;
                knot.rotation.y = time * 0.5;
                particles.rotation.y = time * 0.02;
                renderer.render(scene, camera);
            };
            animate();

            const handleResize = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };
            window.addEventListener('resize', handleResize);

            const updateColors = (newTheme) => {
                theme = newTheme;
                const mainColor = theme === 'dark' ? 0x818cf8 : 0x4f46e5;
                const emissive = theme === 'dark' ? 0x1a1a3e : 0xeef2ff;
                material.color.setHex(mainColor);
                material.emissive.setHex(emissive);
                particlesMat.color.setHex(mainColor);
            };

            window.__threeUpdateColors = updateColors;
        })();

        // =============================================================
        // 2. Theme Toggle
        // =============================================================
        (function themeToggle() {
            const toggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');

            const getTheme = () => {
                const stored = localStorage.getItem('gravitas-theme');
                if (stored) return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            };

            let currentTheme = getTheme();

            const applyTheme = (theme) => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('gravitas-theme', theme);
                currentTheme = theme;

                if (theme === 'light') {
                    themeIcon.className = 'bi bi-sun-fill';
                    themeLabel.textContent = 'Light';
                } else {
                    themeIcon.className = 'bi bi-moon-fill';
                    themeLabel.textContent = 'Dark';
                }

                if (window.__threeUpdateColors) {
                    window.__threeUpdateColors(theme);
                }
            };

            applyTheme(currentTheme);

            toggleBtn.addEventListener('click', () => {
                const next = currentTheme === 'light' ? 'dark' : 'light';
                applyTheme(next);
            });
        })();

        // =============================================================
        // 3. Card Tilt Effect
        // =============================================================
        (function cardTilt() {
            const card = document.getElementById('splashCard');
            if (!card) return;

            const handleMouseMove = (e) => {
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                const rotateX = -y * 6;
                const rotateY = x * 6;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            };

            const handleMouseLeave = () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            };

            card.addEventListener('mousemove', handleMouseMove);
            card.addEventListener('mouseleave', handleMouseLeave);
        })();

        // =============================================================
        // 4. Redirect after 3 seconds
        // =============================================================
        setTimeout(() => {
            window.location.href = "student-dashboard.html";
        }, 3000);
    </script>

</body>

</html>
