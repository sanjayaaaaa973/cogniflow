<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CogniFlow | Resources</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #f5f4ff;
            background: #090914;
        }

        .container {
            width: min(1050px, 94%);
            margin: auto;
            padding: 30px 0;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        button {
            cursor: pointer;
        }

        .back {
            padding: 10px 15px;
            border-radius: 11px;
            border: 1px solid #ffffff12;
            background: #18182b;
            color: #aaa8c4;
        }

        .brand {
            color: #9a86ff;
            font-size: 21px;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
        }

        .sub {
            color: #aaa8c4;
            margin-top: 7px;
            margin-bottom: 25px;
        }

        .resource-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px;
            margin-bottom: 12px;
            border-radius: 18px;
            background: #18182b;
            border: 1px solid #303047;
        }

        .resource-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .pdf-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: rgba(239, 83, 96, 0.15);
            color: #ff6473;
            font-size: 22px;
        }

        .resource-text strong {
            display: block;
            color: white;
        }

        .resource-text small {
            display: block;
            margin-top: 5px;
            color: #9292aa;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 18px;
            border-radius: 10px;
            background: linear-gradient(
                135deg,
                #6545ff,
                #9b3cff
            );
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .loading,
        .empty,
        .error {
            padding: 30px;
            text-align: center;
            color: #aaa;
        }

        @media(max-width:600px) {
            .resource-card {
                align-items: flex-start;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top">

            <button class="back" onclick="history.back()">
                <i class="bi bi-arrow-left"></i>
                Back
            </button>

            <div class="brand"><img src="images/logo.png" alt="CogniFlow Logo" style="height: 34px; width: auto; mix-blend-mode: screen; vertical-align: middle;"></div>

        </div>


        <h1 id="title">
            UI/UX Design Resources
        </h1>

        <p class="sub">
            Download learning materials for your registered course.
        </p>


        <div id="resourcesList">
            <div class="loading">
                Loading learning materials...
            </div>
        </div>

    </div>


    <script type="module">

        import { db } from "./firebase.js";

        import {
            collection,
            getDocs,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";


        const resourcesList =
            document.getElementById("resourcesList");


        // Get course from URL
        const params =
            new URLSearchParams(window.location.search);

        const course =
            params.get("course") || "uiux";


        const titleEl = document.getElementById("title");
        if (titleEl) {
            titleEl.textContent = course === "uiux" ? "UI/UX Design Resources" : (course.toUpperCase() + " Resources");
        }


        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        async function loadResources() {

            try {

                resourcesList.innerHTML = `
                    <div class="loading">
                        Loading learning materials...
                    </div>
                `;


                const q = query(
                    collection(db, "resources"),
                    where("course", "==", course)
                );


                const snapshot =
                    await getDocs(q);


                if (snapshot.empty) {

                    resourcesList.innerHTML = `
                        <div class="empty">
                            No learning materials have been uploaded yet.
                        </div>
                    `;

                    return;
                }


                const resources = [];


                snapshot.forEach(docSnap => {

                    resources.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });

                });


                // Newest first
                resources.sort((a, b) => {

                    const aTime =
                        a.createdAt?.toMillis?.() || 0;

                    const bTime =
                        b.createdAt?.toMillis?.() || 0;

                    return bTime - aTime;

                });


                resourcesList.innerHTML = "";


                resources.forEach(resource => {

                    const title =
                        escapeHTML(
                            resource.title ||
                            resource.fileName ||
                            "UI/UX Learning Material"
                        );


                    const fileName =
                        escapeHTML(
                            resource.fileName ||
                            "PDF Document"
                        );


                    const url =
                        resource.url || "";


                    if (!url) return;


                    resourcesList.innerHTML += `

                        <div class="resource-card">

                            <div class="resource-info">

                                <div class="pdf-icon">
                                    <i class="bi bi-file-earmark-pdf-fill"></i>
                                </div>


                                <div class="resource-text">

                                    <strong>
                                        ${title}
                                    </strong>

                                    <small>
                                        ${fileName}
                                    </small>

                                </div>

                            </div>


                            <a
                                href="${url}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="download-btn"
                            >
                                <i class="bi bi-download"></i>
                                Download
                            </a>

                        </div>

                    `;

                });


            } catch (error) {

                console.error(
                    "Failed to load resources:",
                    error
                );


                resourcesList.innerHTML = `

                    <div class="error">

                        Unable to load learning materials.

                        <br>

                        Please try again.

                    </div>

                `;

            }

        }


        loadResources();

    </script>

</body>

</html>
