<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CogniFlow | Resources</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #f5f4ff;
            background: #090914;
        }

        .container {
            width: min(1050px, 94%);
            margin: auto;
            padding: 30px 0;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        button {
            cursor: pointer;
        }

        .back {
            padding: 10px 15px;
            border-radius: 11px;
            border: 1px solid #ffffff12;
            background: #18182b;
            color: #aaa8c4;
        }

        .brand {
            color: #9a86ff;
            font-size: 21px;
            font-weight: bold;
        }

        h1 {
            font-size: 28px;
        }

        .sub {
            color: #aaa8c4;
            margin-top: 7px;
            margin-bottom: 25px;
        }

        .resource {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px;
            margin-bottom: 12px;
            border-radius: 17px;
            border: 1px solid #ffffff12;
            background: linear-gradient(145deg, #1d1d34, #141426);
        }

        .pdf {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: #ef405322;
            color: #ff6573;
            font-size: 25px;
        }

        .info {
            flex: 1;
        }

        .info h3 {
            font-size: 14px;
        }

        .info p {
            color: #aaa8c4;
            font-size: 11px;
            margin-top: 5px;
        }

        .download {
            padding: 11px 16px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            background: linear-gradient(90deg, #5744ed, #8c38f2);
            text-decoration: none;
        }

        @media(max-width:600px) {
            .resource {
                align-items: flex-start;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top">

            <button class="back" onclick="history.back()">
                <i class="bi bi-arrow-left"></i>
                Back
            </button>

            <div class="brand"><img src="images/logo.png" alt="CogniFlow Logo" style="height: 34px; width: auto; mix-blend-mode: screen; vertical-align: middle;"></div>

        </div>


        <h1 id="title">
            Course Resources
        </h1>

        <p class="sub">
            Download learning materials for your registered course.
        </p>


        <div id="resourceList"></div>

    </div>


    <script>

        const course =
            new URLSearchParams(location.search)
                .get("course") || "uiux";


        const resources = {

            uiux: {
                title: "UI/UX Design Resources",

                files: [
                    {
                        name: "UI/UX Design - Sample Course Material",
                        type: "PDF Document",
                        file: "uiux_sample_material.pdf"
                    },
                    {
                        name: "Mental Models - Lecture Material",
                        type: "PDF Document",
                        file: "uiux_sample_material.pdf"
                    },
                    {
                        name: "Cognitive Frameworks - Notes",
                        type: "PDF Document",
                        file: "uiux_sample_material.pdf"
                    }
                ]
            },

            designpatterns: {
                title: "Design Patterns Resources",

                files: [
                    {
                        name: "Design Patterns - Sample Course Material",
                        type: "PDF Document",
                        file: "design_patterns_sample_material.pdf"
                    },
                    {
                        name: "Module 1 - Introduction",
                        type: "PDF Document",
                        file: "design_patterns_sample_material.pdf"
                    },
                    {
                        name: "Module 2 - Creational Patterns",
                        type: "PDF Document",
                        file: "design_patterns_sample_material.pdf"
                    }
                ]
            }

        };


        const data =
            resources[course] ||
            resources.uiux;


        document.getElementById("title")
            .textContent = data.title;


        const list =
            document.getElementById("resourceList");


        data.files.forEach(file => {

            list.innerHTML += `

        <div class="resource">

            <div class="pdf">
                <i class="bi bi-file-earmark-pdf-fill"></i>
            </div>

            <div class="info">

                <h3>
                    ${file.name}
                </h3>

                <p>
                    ${file.type}
                </p>

            </div>

            <a
                class="download"
                href="${file.file}"
                download
            >
                <i class="bi bi-download"></i>
                Download
            </a>

        </div>

    `;

        });

    </script>

</body>

</html>
