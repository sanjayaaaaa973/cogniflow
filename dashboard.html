<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravitas'26 Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />

    <style>
        /* ===== CSS Variables / Themes ===== */
        :root {
            --bg-body: #f4f6fb;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-input-disabled: #e9ecef;
            --bg-table-stripe: #f8f9fc;
            --bg-hover: #f0f4ff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #6c7a92;
            --border-color: #e2e8f0;
            --shadow: 0 12px 40px rgba(0, 20, 40, 0.08);
            --shadow-hover: 0 16px 48px rgba(0, 20, 40, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --accent-gradient: linear-gradient(135deg, #4f46e5, #7c3aed);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --modal-bg: rgba(255, 255, 255, 0.92);
            --modal-border: rgba(255, 255, 255, 0.3);
            --modal-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            --modal-overlay: rgba(0, 0, 0, 0.35);
            --modal-text: #1a1a2e;
        }

        [data-theme="dark"] {
            --bg-body: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-input: #252540;
            --bg-input-disabled: #2a2a48;
            --bg-table-stripe: #1e1e36;
            --bg-hover: #2a2a50;
            --text-primary: #e8e8f0;
            --text-secondary: #b0b0cc;
            --text-muted: #8888aa;
            --border-color: #333355;
            --shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.8);
            --accent: #818cf8;
            --accent-light: #1e1e3a;
            --modal-bg: rgba(26, 26, 46, 0.95);
            --modal-border: rgba(255, 255, 255, 0.10);
            --modal-shadow: 0 25px 80px rgba(0, 0, 0, 0.9);
            --modal-overlay: rgba(0, 0, 0, 0.6);
            --modal-text: #f0f0ff;
        }

        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 1.5rem;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* ===== Card ===== */
        .dashboard-card {
            max-width: 960px;
            margin: 0 auto;
            width: 100%;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem 2.25rem;
            transition: background var(--transition), box-shadow var(--transition),
                transform 0.2s ease;
            border: 1px solid var(--border-color);
        }

        .dashboard-card:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ===== Header ===== */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.75rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .brand-logo {
            width: 420px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .brand-sub {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            background: none;
            letter-spacing: 0.3px;
        }

        .brand-sub i {
            margin-right: 0.3rem;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-caption {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 3px;
        }

        .welcome-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(79, 70, 229, 0.15);
        }

        .welcome-pill span {
            color: var(--text-primary);
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 220px;
        }

        /* ===== Theme Toggle ===== */
        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 0.45rem 0.9rem 0.45rem 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            font-family: var(--font);
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .theme-toggle .toggle-track {
            width: 38px;
            height: 20px;
            border-radius: 50px;
            background: var(--border-color);
            position: relative;
            transition: background var(--transition);
            flex-shrink: 0;
        }

        .theme-toggle .toggle-track .toggle-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform var(--transition), background var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] .theme-toggle .toggle-track {
            background: var(--accent);
        }

        [data-theme="dark"] .theme-toggle .toggle-track .toggle-thumb {
            transform: translateX(18px);
            background: #fff;
        }

        .theme-toggle .toggle-label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* ===== REQUEST TYPE TOGGLE ===== */
        .request-toggle {
            display: flex;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1.5px solid var(--accent);
            background: var(--bg-input);
        }

        .request-toggle button {
            flex: 1;
            padding: 12px 14px;
            background: var(--bg-input);
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font);
            letter-spacing: 0.3px;
        }

        .request-toggle button:hover {
            background: var(--accent-light);
        }

        .request-toggle button.active {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }

        [data-theme="dark"] .request-toggle button {
            background: var(--bg-input);
            color: var(--text-secondary);
        }

        [data-theme="dark"] .request-toggle button.active {
            background: var(--accent-gradient);
            color: #fff;
        }

        [data-theme="dark"] .request-toggle {
            border-color: var(--accent);
        }

        /* ===== Form Elements ===== */
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }

        .form-control,
        .form-select {
            background: var(--bg-input);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.92rem;
            padding: 0.6rem 0.9rem;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-control[type="number"] {
            -moz-appearance: textfield;
            text-align: center;
            width: 60px;
        }

        .form-control[type="number"]::-webkit-outer-spin-button,
        .form-control[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .form-check-input {
            width: 1.2rem;
            height: 1.2rem;
            border-radius: 4px;
            border: 2px solid var(--border-color);
            background: var(--bg-input);
            transition: all var(--transition);
            cursor: pointer;
            margin-top: 0;
        }

        .form-check-input:checked {
            background-color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .form-check-input:focus {
            box-shadow: 0 0 0 3px var(--accent-light);
            border-color: var(--accent);
        }

        /* ===== Section Headers ===== */
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title i {
            color: var(--accent);
            font-size: 1.1rem;
        }

        .divider {
            border: 0;
            border-top: 1.5px solid var(--border-color);
            margin: 1.5rem 0;
            opacity: 0.6;
        }

        /* ===== Table ===== */
        .table-wrap {
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .table {
            margin-bottom: 0;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .table th,
        .table td {
            color: var(--text-primary);
        }

        .table thead th {
            background: var(--bg-table-stripe);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1.5px solid var(--border-color);
            padding: 0.8rem 0.9rem;
        }

        .table tbody td {
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0.9rem;
            vertical-align: middle;
            background: var(--bg-card);
        }

        .table tbody tr:last-child td {
            border-bottom: 0;
        }

        .table tbody tr:hover td {
            background: var(--bg-hover);
        }

        .table .item-name {
            font-weight: 500;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .qty-control .btn-qty {
            background: var(--bg-input);
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all var(--transition);
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .qty-control .btn-qty:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .qty-control .btn-qty:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .qty-control .qty-input {
            width: 50px;
            padding: 0.2rem 0.1rem;
            font-size: 0.85rem;
            text-align: center;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .qty-control .qty-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        /* ===== Search Bar ===== */
        .search-container {
            margin-bottom: 0.75rem;
        }

        .search-container .search-input {
            background: var(--bg-input);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.5rem 0.9rem;
            font-size: 0.9rem;
            color: var(--text-primary);
            width: 100%;
            transition: all var(--transition);
        }

        .search-container .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
            outline: none;
        }

        .search-container .search-input::placeholder {
            color: var(--text-muted);
        }

        /* ===== Submit Button ===== */
        .btn-submit {
            background: var(--accent-gradient);
            border: none;
            border-radius: 50px;
            padding: 0.7rem 2.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            transition: all var(--transition);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            font-family: var(--font);
            letter-spacing: 0.3px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.45);
            color: #fff;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* ===== PROFESSIONAL MODAL ===== */
        #modalOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            background: var(--modal-overlay);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            animation: modalFadeIn 0.3s ease;
        }

        #modalOverlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--modal-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--modal-border);
            border-radius: var(--radius);
            box-shadow: var(--modal-shadow);
            padding: 2rem 2.5rem;
            max-width: 440px;
            width: 92%;
            text-align: center;
            animation: modalSlideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .modal-box .modal-icon {
            font-size: 3.2rem;
            margin-bottom: 0.75rem;
            display: block;
            line-height: 1;
        }

        .modal-box .modal-icon.confirm-icon {
            color: #f59e0b;
        }

        .modal-box .modal-icon.success-icon {
            color: #10b981;
        }

        .modal-box .modal-icon.error-icon {
            color: #ef4444;
        }

        .modal-box .modal-icon.info-icon {
            color: var(--accent);
        }

        .modal-box .modal-title {
            font-family: var(--font);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--modal-text);
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }

        .modal-box .modal-message {
            font-family: var(--font);
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 1.75rem;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-box .modal-btn {
            font-family: var(--font);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.6rem 1.8rem;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            min-width: 100px;
        }

        .modal-box .modal-btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
        }

        .modal-box .modal-btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.45);
        }

        .modal-box .modal-btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1.5px solid var(--border-color);
        }

        .modal-box .modal-btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .modal-box .modal-btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }

        .modal-box .modal-btn-success:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.45);
        }

        .modal-box .modal-btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
        }

        .modal-box .modal-btn-danger:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.45);
        }

        .modal-box .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.3rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition);
            font-family: var(--font);
            padding: 0 4px;
            line-height: 1;
        }

        .modal-box .modal-close:hover {
            color: var(--text-primary);
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes modalSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 992px) {
            .dashboard-card {
                padding: 1.5rem 1.5rem;
            }

            .brand-logo {
                height: 42px;
                width: auto;
            }

            .brand-sub {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 0.75rem;
            }

            .dashboard-card {
                padding: 1.25rem 1rem;
                border-radius: 12px;
            }

            .brand-header {
                flex-direction: column;
                align-items: center;
                gap: 0.75rem;
            }

            .brand-left {
                justify-content: center;
                width: 100%;
            }

            .brand-logo {
                height: 38px;
                width: auto;
            }

            .brand-sub {
                text-align: center;
                display: block;
                width: 100%;
                font-size: 0.7rem;
            }

            .theme-toggle {
                align-self: center;
                padding: 0.35rem 0.7rem 0.35rem 0.5rem;
                font-size: 0.78rem;
            }

            .theme-toggle .toggle-track {
                width: 32px;
                height: 18px;
            }

            .theme-toggle .toggle-track .toggle-thumb {
                width: 14px;
                height: 14px;
            }

            [data-theme="dark"] .theme-toggle .toggle-track .toggle-thumb {
                transform: translateX(14px);
            }

            .section-title {
                font-size: 0.85rem;
            }

            .form-control,
            .form-select {
                font-size: 0.85rem;
                padding: 0.5rem 0.7rem;
            }

            .table thead th,
            .table tbody td {
                padding: 0.4rem 0.5rem;
                font-size: 0.8rem;
            }

            .qty-control .qty-input {
                width: 42px;
                font-size: 0.8rem;
            }

            .qty-control .btn-qty {
                width: 26px;
                height: 26px;
                font-size: 0.85rem;
            }

            .btn-submit {
                padding: 0.6rem 2rem;
                font-size: 0.85rem;
                width: 100%;
            }

            .divider {
                margin: 1.2rem 0;
            }

            .row-coord .col-md-4 {
                margin-bottom: 0.6rem;
            }

            .row-coord .col-md-4:last-child {
                margin-bottom: 0;
            }

            .search-container .search-input {
                font-size: 0.85rem;
                padding: 0.4rem 0.7rem;
            }

            .modal-box {
                padding: 1.5rem 1.25rem;
                max-width: 380px;
            }

            .modal-box .modal-title {
                font-size: 1.1rem;
            }

            .modal-box .modal-btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.85rem;
                min-width: 80px;
            }

            .request-toggle button {
                padding: 10px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 400px) {
            .dashboard-card {
                padding: 0.9rem 0.7rem;
            }

            .brand-logo {
                height: 32px;
                width: auto;
            }

            .table thead th,
            .table tbody td {
                padding: 0.3rem 0.3rem;
                font-size: 0.7rem;
            }

            .qty-control .qty-input {
                width: 34px;
                font-size: 0.7rem;
                padding: 0.1rem;
            }

            .qty-control .btn-qty {
                width: 22px;
                height: 22px;
                font-size: 0.7rem;
            }

            .form-check-input {
                width: 1rem;
                height: 1rem;
            }

            .modal-box {
                padding: 1.25rem 0.9rem;
                max-width: 340px;
            }

            .request-toggle button {
                padding: 8px 10px;
                font-size: 12px;
            }
        }

        /* ===== Utility ===== */
        .text-muted-custom {
            color: var(--text-muted);
        }

        .no-items-msg {

                setModal({
                    visible: true,

            const showAlert = (title, message, type = 'success', onClose = null) => {
                const iconMap = {
                    success: 'bi bi-check-circle-fill',
                    error: 'bi bi-exclamation-circle-fill',
                    info: 'bi bi-info-circle-fill',

                setModal({
                    visible: true,

                    cancelText: '',
                    icon: iconMap[type] || iconMap.info,
                    alertType: type,
                });
            };

            const closeModal = () => {
                setModal(prev => ({ ...prev, visible: false }));
            };

                if (modal.onConfirm) modal.onConfirm();

            };

        const darkenImage = (img, amount = 50) => {
            return new Promise((resolve, reject) => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;

                    // Darken each pixel by reducing RGB values
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.max(0, data[i] - amount);     // R
                        data[i + 1] = Math.max(0, data[i + 1] - amount); // G
                        data[i + 2] = Math.max(0, data[i + 2] - amount); // B
                        // Alpha stays unchanged
                    }

                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                } catch (err) {
                    reject(err);
                }
            });
        };

                        const recipientEmail = 'sanjaygs2406@gmail.com';
                        const SERVICE_ID = 'service_1796a5g';
                        const TEMPLATE_ID = 'template_fwul7bo';
                        const PUBLIC_KEY = 'sRZ_ixA1Xm913C0Ru';

                                                                <i className="bi bi-dash"></i>
                                                            </button>
                                                            <input
                                                                type="number"
                                                                className="qty-input"
                                                                value={qty}
                                                                min="0"
                                                                onChange={(e) => handleQtyChange(item.id, e.target.value)}
                                                                disabled={!checked}
                                                            />
                                                            <button
                                                                type="button"
                                                                className="btn-qty"
                                                                onClick={() => handleIncrement(item.id)}
                                                            >
                                                                <i className="bi bi-plus"></i>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>

                        <hr />
                        <h5>Other Items (Not Available Above)</h5>
                        <button className="btn btn-success mb-3" type="button" onClick={addCustomItem}>
                            + Add Another
                        </button>

                        {customItems.map((item) => (
                            <div className="row mb-2 g-2" key={item.id}>
                                <div className="col-md-8">
                                    <input
                                        type="text"
                                        className="form-control"
                                        placeholder="Enter Item Name"
                                        value={item.name}
                                        onChange={(e) => {
                                            setCustomItems(prev =>
                                                prev.map((x) =>
                                                    x.id === item.id
                                                        ? { ...x, name: e.target.value }
                                                        : x
                                                )
                                            );
                                        }}
                                    />
                                </div>
                                <div className="col-md-2">
                                    <div className="qty-control">
                                        <button
                                            type="button"
                                            className="btn-qty"
                                            onClick={() => {
                                                setCustomItems(prev =>
                                                    prev.map((x) =>
                                                        x.id === item.id
                                                            ? { ...x, quantity: Math.max(1, x.quantity - 1) }
                                                            : x
                                                    )
                                                );
                                            }}
                                            disabled={item.quantity <= 1}
                                        >
                                            <i className="bi bi-dash"></i>
                                        </button>
                                        <input
                                            type="number"
                                            min="1"
                                            className="qty-input"
                                            value={item.quantity}
                                            onChange={(e) => {
                                                const nextValue = Number(e.target.value);
                                                setCustomItems(prev =>
                                                    prev.map((x) =>
                                                        x.id === item.id
                                                            ? { ...x, quantity: Number.isNaN(nextValue) ? 1 : Math.max(1, nextValue) }
                                                            : x
                                                    )
                                                );
                                            }}
                                        />
                                        <button
                                            type="button"
                                            className="btn-qty"
                                            onClick={() => {
                                                setCustomItems(prev =>
                                                    prev.map((x) =>
                                                        x.id === item.id
                                                            ? { ...x, quantity: x.quantity + 1 }
                                                            : x
                                                    )
                                                );
                                            }}
                                        >
                                            <i className="bi bi-plus"></i>
                                        </button>
                                    </div>
                                </div>
                                <div className="col-md-2">
                                    <button
                                        className="btn btn-danger w-100"
                                        type="button"
                                        onClick={() => {
                                            setCustomItems(prev => prev.filter((x) => x.id !== item.id));
                                        }}
                                    >
                                        Remove
                                    </button>
                                </div>
                            </div>
                        ))}

                        <div className="text-center mt-4">
                            <button
                                className="btn-submit"
                                type="submit"
                                disabled={
                                    coordRegError ||
                                    coordMobileError ||
                                    (requestType === 'Club' && (pocRegError || pocMobileError))
                                }
                            >
                                <i className="bi bi-check2-circle me-2" />
                                Submit
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ModalProvider>
                <App />
            </ModalProvider>
        );
    </script>
</body>

</html>
